name: Keep Render awake

# Render's free tier sleeps the API after ~15 min idle, causing a 30-60s cold start.
# This pings the API /health every 5 min so it stays warm for live demos. GitHub often
# delays scheduled runs, so 5 min gives a safe margin under the 15-min sleep.
#
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables, add:
#   API_URL = https://<your-api>.onrender.com   (required; no trailing slash)
#   WEB_URL = https://<your-web>.onrender.com   (optional; static site never sleeps)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual "wake now" button — click right before presenting

concurrency:
  group: keep-alive
  cancel-in-progress: true # a slow cold-start ping shouldn't let runs pile up

permissions: {} # outbound requests only — no repo access needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health (the service that sleeps)
        if: ${{ vars.API_URL != '' }}
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          target="${API_URL%/}/health"
          echo "Pinging $target"
          curl --fail --silent --show-error --location \
               --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
               "$target"
          echo
          echo "API is awake."

      - name: Ping web (optional — static CDN, never sleeps)
        if: ${{ vars.WEB_URL != '' }}
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          curl --fail --silent --show-error --location \
               --max-time 60 --retry 3 --retry-all-errors \
               --output /dev/null "${WEB_URL%/}"
          echo "Web is reachable."

      - name: Remind to configure API_URL
        if: ${{ vars.API_URL == '' }}
        run: |
          echo "::warning::Set the repo variable API_URL (Settings -> Secrets and variables -> Actions -> Variables) to enable the keep-alive ping."
